<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="120" cy="90" r="65" fill="url(#purpleGlow)"/>
  <g transform="translate(120, 90) scale(0.95)" filter="url(#glow)">
    <!-- 3D Spiral Gen AI Bloom Structure -->
    <path d="M0 -45 C25 -45 45 -25 45 0 C45 25 25 45 0 45 C-25 45 -45 25 -45 0 C-45 -25 -25 -45 0 -45" stroke="url(#violetGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="0" cy="0" rx="36" ry="18" stroke="#A855F7" stroke-width="4" transform="rotate(30)" fill="none"/>
    <ellipse cx="0" cy="0" rx="36" ry="18" stroke="#818CF8" stroke-width="4" transform="rotate(90)" fill="none"/>
    <ellipse cx="0" cy="0" rx="36" ry="18" stroke="#C084FC" stroke-width="4" transform="rotate(150)" fill="none"/>
    <circle cx="0" cy="0" r="14" fill="url(#violetGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <!-- Floating Sparkles -->
    <circle cx="38" cy="-32" r="3.5" fill="#DDD6FE"/>
    <circle cx="-40" cy="28" r="3" fill="#C4B5FD"/>
    <circle cx="34" cy="36" r="2.5" fill="#E9D5FF"/>
  </g>
</svg>
