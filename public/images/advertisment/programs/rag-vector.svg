<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diskTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="diskSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="90" r="65" fill="url(#greenGlow)"/>
  <g transform="translate(120, 90)">
    <!-- 3D Cylindrical Vector DB Disks -->
    <!-- Bottom Disk -->
    <g transform="translate(0, 18)">
      <path d="M-36 0 C-36 12 36 12 36 0 L36 14 C36 24 -36 24 -36 14 Z" fill="url(#diskSide)"/>
      <ellipse cx="0" cy="0" rx="36" ry="12" fill="url(#diskTop)"/>
    </g>
    <!-- Middle Disk -->
    <g transform="translate(0, -2)">
      <path d="M-36 0 C-36 12 36 12 36 0 L36 14 C36 24 -36 24 -36 14 Z" fill="url(#diskSide)"/>
      <ellipse cx="0" cy="0" rx="36" ry="12" fill="url(#diskTop)"/>
    </g>
    <!-- Top Disk -->
    <g transform="translate(0, -22)">
      <path d="M-36 0 C-36 12 36 12 36 0 L36 14 C36 24 -36 24 -36 14 Z" fill="url(#diskSide)"/>
      <ellipse cx="0" cy="0" rx="36" ry="12" fill="url(#diskTop)"/>
      <ellipse cx="0" cy="0" rx="20" ry="6" stroke="#ECFDF5" stroke-width="2" fill="none"/>
      <circle cx="0" cy="0" r="3" fill="#ECFDF5"/>
    </g>
    <!-- Floating Vector Points -->
    <circle cx="-38" cy="-14" r="3" fill="#A7F3D0"/>
    <circle cx="38" cy="8" r="3" fill="#A7F3D0"/>
    <line x1="-38" y1="-14" x2="-26" y2="-20" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
</svg>
