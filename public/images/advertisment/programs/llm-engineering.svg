<svg width="240" height="180" viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="leftCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="rightCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="90" r="65" fill="url(#blueGlow)"/>
  <g transform="translate(120, 90)">
    <!-- Central Isometric 3D Cubes Cluster -->
    <!-- Center Cube -->
    <g transform="translate(0, -5)">
      <!-- Top -->
      <polygon points="0,-22 24,-8 0,6 -24,-8" fill="url(#topCube)"/>
      <!-- Left -->
      <polygon points="-24,-8 0,6 0,34 -24,20" fill="url(#leftCube)"/>
      <!-- Right -->
      <polygon points="0,6 24,-8 24,20 0,34" fill="url(#rightCube)"/>
    </g>
    <!-- Left Satellite Cube -->
    <g transform="translate(-32, -18) scale(0.65)">
      <polygon points="0,-22 24,-8 0,6 -24,-8" fill="url(#topCube)"/>
      <polygon points="-24,-8 0,6 0,34 -24,20" fill="url(#leftCube)"/>
      <polygon points="0,6 24,-8 24,20 0,34" fill="url(#rightCube)"/>
    </g>
    <!-- Right Satellite Cube -->
    <g transform="translate(34, 12) scale(0.65)">
      <polygon points="0,-22 24,-8 0,6 -24,-8" fill="url(#topCube)"/>
      <polygon points="-24,-8 0,6 0,34 -24,20" fill="url(#leftCube)"/>
      <polygon points="0,6 24,-8 24,20 0,34" fill="url(#rightCube)"/>
    </g>
    <!-- Neural Link Lines -->
    <line x1="-20" y1="-12" x2="-2" y2="-6" stroke="#93C5FD" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="8" y1="18" x2="24" y2="12" stroke="#93C5FD" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="-20" cy="-12" r="3" fill="#60A5FA"/>
    <circle cx="24" cy="12" r="3" fill="#60A5FA"/>
  </g>
</svg>
